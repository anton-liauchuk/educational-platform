databaseChangeLog:
  - changeSet:
      id: 2021_06_25-1
      author: antonliauchuk
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: custom_user
      changes:
        - createTable:
            tableName: custom_user
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  startWith: 1
                  incrementBy: 1
                  constraints:
                    primaryKey: true
                    primaryKeyName: custom_user_pk
              - column:
                  constraints:
                    nullable: false
                  name: username
                  type: VARCHAR(100)
              - column:
                  constraints:
                    nullable: false
                  name: email
                  type: VARCHAR(100)
              - column:
                  constraints:
                    nullable: false
                  name: password
                  type: VARCHAR(100)
              - column:
                  constraints:
                    nullable: false
                  name: role
                  type: VARCHAR(100)
